services:
  api:
    image: jhosuacom-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL=postgres://${DB_USER:-jhosua}:${DB_PASSWORD}@jhosua-db:5432/${DB_NAME:-jhosua}
      - DB_USER=${DB_USER:-jhosua}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-jhosua}
      - JWT_SECRET=${JWT_SECRET}
      - API_PORT=3000
      - PUBLIC_WEB_URL=${PUBLIC_WEB_URL:-https://jhosuacomercial.com}
      - ODOO_URL=${ODOO_URL:-}
      - ODOO_DB=${ODOO_DB:-}
      - ODOO_USERNAME=${ODOO_USERNAME:-}
      - ODOO_API_KEY=${ODOO_API_KEY:-}
      - ODOO_COMPANY_IDS=${ODOO_COMPANY_IDS:-}
      - ODOO_MOCK=${ODOO_MOCK:-true}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-jhhogar}
      - ADMIN_NOTIFY_PHONES=${ADMIN_NOTIFY_PHONES:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@jhhogar.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RUN_DB_PUSH=${RUN_DB_PUSH:-true}
      - RUN_DB_SEED=${RUN_DB_SEED:-true}
    networks:
      - RenaceNet
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          cpus: "0.50"
          memory: "768M"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.jhosua-api-http.rule=Host(`api.jhosuacomercial.com`)"
        - "traefik.http.routers.jhosua-api-http.entrypoints=web"
        - "traefik.http.routers.jhosua-api-http.middlewares=jhosua-api-redirect"
        - "traefik.http.middlewares.jhosua-api-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.jhosua-api.rule=Host(`api.jhosuacomercial.com`)"
        - "traefik.http.routers.jhosua-api.entrypoints=websecure"
        - "traefik.http.routers.jhosua-api.tls=true"
        - "traefik.http.routers.jhosua-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.jhosua-api.loadbalancer.server.port=3000"

  web:
    image: jhosuacom-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.jhosuacomercial.com/api}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.jhosuacomercial.com/api}
    networks:
      - RenaceNet
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          cpus: "0.50"
          memory: "768M"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.jhosua-web-http.rule=Host(`jhosuacomercial.com`) || Host(`www.jhosuacomercial.com`)"
        - "traefik.http.routers.jhosua-web-http.entrypoints=web"
        - "traefik.http.routers.jhosua-web-http.middlewares=jhosua-web-redirect"
        - "traefik.http.middlewares.jhosua-web-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.jhosua-web-redirect.redirectscheme.permanent=true"
        - "traefik.http.routers.jhosua-web.rule=Host(`jhosuacomercial.com`) || Host(`www.jhosuacomercial.com`)"
        - "traefik.http.routers.jhosua-web.entrypoints=websecure"
        - "traefik.http.routers.jhosua-web.tls=true"
        - "traefik.http.routers.jhosua-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.jhosua-web.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-jhosua}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-jhosua}
    volumes:
      - jhosua_db_data:/var/lib/postgresql/data
    networks:
      RenaceNet:
        aliases:
          - jhosua-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: "1G"

networks:
  RenaceNet:
    external: true

volumes:
  jhosua_db_data:
